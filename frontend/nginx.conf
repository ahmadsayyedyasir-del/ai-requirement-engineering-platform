# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — Nginx web server configuration for the production frontend.
#
# WHY NGINX?
#   The React app is compiled by `vite build` into static files (HTML, JS, CSS).
#   Nginx serves these files extremely efficiently — it handles thousands of
#   concurrent requests with minimal memory.
#   It also acts as a reverse proxy for API calls, routing them to FastAPI.
#
# THE "SPA PROBLEM":
#   React Router uses the HTML5 History API to change URLs without page reloads.
#   When a user navigates to /projects/abc123 and hits refresh, the browser
#   asks Nginx for the file /projects/abc123/index.html — which doesn't exist.
#   Without the try_files fix, Nginx would return 404.
#
#   try_files $uri $uri/ /index.html — the SPA fix:
#     1. Look for the exact file ($uri): /projects/abc123 → no file
#     2. Look for a directory ($uri/):  /projects/abc123/ → no directory
#     3. Fall back to /index.html      → React app loads, Router handles the path
#
# API PROXYING:
#   In the Docker setup, the frontend and API are separate containers.
#   When the browser makes a request to /api/..., Nginx forwards it to the
#   `api` container at http://api:8000 (using the Docker service name).
#   This eliminates CORS issues — browser sees the same origin for both
#   frontend and API (both come from the Nginx server on port 80).
#
# GZIP:
#   Compresses text-based responses (HTML, CSS, JS, JSON) before sending.
#   Reduces bandwidth and improves load time — JS bundles can be 5x smaller.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;                           # Listen on port 80 (HTTP)
    root /usr/share/nginx/html;          # Directory where the Vite build output is copied
    index index.html;                    # Default file to serve when no filename is given

    # ── API Proxy ──────────────────────────────────────────────────────────
    # Any request starting with /api/ is forwarded to the FastAPI container.
    # This makes the API appear to be on the same origin as the frontend,
    # which means no CORS headers are needed for browser requests.
    location /api/ {
        # "api" is the Docker Compose service name — resolves to the API container's IP
        proxy_pass http://api:8000;

        # Pass the original Host header so FastAPI sees the correct domain
        proxy_set_header Host $host;

        # Pass the client's real IP address (not the proxy's IP) to FastAPI logs
        proxy_set_header X-Real-IP $remote_addr;

        # Standard header for identifying the originating IP when behind a proxy
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── React SPA Fallback ─────────────────────────────────────────────────
    # ALL non-API routes serve the React app's index.html.
    # React Router then reads the URL and renders the correct page client-side.
    location / {
        # try_files checks if the path exists as:
        #   1. A file ($uri)       → serve the file (CSS, JS, images)
        #   2. A directory ($uri/) → serve directory index
        #   3. Fallback (/index.html) → serve the React app (SPA fix)
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip Compression ──────────────────────────────────────────────────
    # Compresses responses before sending — reduces transfer size.
    # The browser decompresses transparently.
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml;  # Add more MIME types here if needed
}
